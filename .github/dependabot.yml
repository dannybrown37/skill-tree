version: 2

# Every stream waits a week before proposing a new release: long enough that a
# compromised version is usually yanked first. Security updates skip the wait.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
    cooldown:
      default-days: 7

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: weekly
    groups:
      hooks:
        patterns: ['*']
    commit-message:
      prefix: 'ci'
    cooldown:
      default-days: 7
