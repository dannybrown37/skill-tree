default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # Git runs the whole pre-commit stage before it ever reaches commit-msg, so
  # the commitizen hook below can only reject a bad message *after* the tests.
  # This one recovers the `git commit -m` message from git's argv and checks it
  # first, so a malformed message fails immediately instead of after the suite.
  - repo: local
    hooks:
      - id: commitizen-early
        name: Commitizen check (early)
        entry: python3 scripts/check_commit_msg_early.py
        language: system
        stages: [pre-commit]
        always_run: true
        pass_filenames: false
        fail_fast: true

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: local
    hooks:
      - id: bump-on-push
        name: Bump version and push
        entry: scripts/bump_on_push.sh
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.8.0-1
    hooks:
      - id: shfmt
        args: ["-i", "4"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: ruff check --fix --config .ruff.toml
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: Ruff format
        entry: bash -c 'ruff format --config .ruff.toml "$@" && git add "$@"' --
        language: system
        types: [python]
        pass_filenames: true
        require_serial: true

      - id: check-skill-structure
        name: Check skill frontmatter and bundled resources
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && python3 scripts/check_skill_structure.py'
        language: system
        always_run: true
        pass_filenames: false

      - id: scripts-tests
        name: scripts/ and skills/ tests
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && uv run --with pytest pytest scripts/ skills/ -q'
        language: system
        files: ^(scripts|skills)/.*\.py$
        pass_filenames: false
