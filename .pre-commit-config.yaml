default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  # commitizen-early rejects a bad message during the pre-commit stage, before
  # the slow hooks; bump-on-push turns conventional commits into a version,
  # changelog and tag on push (see [tool.commitizen] in .cz.toml for what it
  # rewrites). Both live in git-a-grip so this repo and gtd share one copy.
  - repo: https://github.com/dannybrown37/git-a-grip
    rev: v0.2.0
    hooks:
      - id: commitizen-early
        fail_fast: true
      - id: bump-on-push
      - id: ruff-check
        args: [--config, .ruff.toml]
      - id: ruff-format
        args: [--config, .ruff.toml]
      - id: pytest
        args: ['--runner=uv run --with pytest pytest', scripts/, skills/, -q]
        files: ^(scripts|skills)/.*\.py$

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.8.0-1
    hooks:
      - id: shfmt
        args: ["-i", "4"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: check-skill-structure
        name: Check skill frontmatter and bundled resources
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && python3 scripts/check_skill_structure.py'
        language: system
        always_run: true
        pass_filenames: false
