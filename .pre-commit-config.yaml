default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  # These live in git-a-grip so every repo shares one copy. Releasing is no
  # longer a hook: run `git-release` (aliased to gp) to bump, tag and push.
  - repo: https://github.com/dannybrown37/git-a-grip
    rev: v0.11.0
    hooks:
      - id: commitizen-early
        fail_fast: true
      - id: ruff-check
        args: [--config, .ruff.toml]
      - id: ruff-format
        args: [--config, .ruff.toml]
      - id: pytest
        args: ['--runner=uv run --with pytest pytest', scripts/, skills/, -q]
        files: ^(scripts|skills)/.*\.py$
      - id: block-private-terms

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.17.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.8.0-1
    hooks:
      - id: shfmt
        args: ["-i", "4"]

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.10.0.1
    hooks:
      - id: shellcheck

  - repo: local
    hooks:
      - id: check-skill-structure
        name: Check skill frontmatter and bundled resources
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && python3 scripts/check_skill_structure.py'
        language: system
        always_run: true
        pass_filenames: false
