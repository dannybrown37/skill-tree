repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: end-of-file-fixer
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-yaml
      - id: mixed-line-ending

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff check
        entry: ruff check --fix --config .ruff.toml
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: Ruff format
        entry: bash -c 'ruff format --config .ruff.toml "$@" && git add "$@"' --
        language: system
        types: [python]
        pass_filenames: true
        require_serial: true

      - id: check-skill-structure
        name: Check skill frontmatter and bundled resources
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && python3 scripts/check_skill_structure.py'
        language: system
        always_run: true
        pass_filenames: false

      - id: scripts-tests
        name: scripts/ tests
        entry: bash -c 'cd "$(git rev-parse --show-toplevel)" && uv run --with pytest pytest scripts/ -q'
        language: system
        files: ^scripts/.*\.py$
        pass_filenames: false
