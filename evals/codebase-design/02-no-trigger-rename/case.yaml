schema_version: "1.0"
name: codebase-design/02-no-trigger-rename
description: >-
  Negative trigger: a mechanical rename is not interface design. The skill
  is manual-only and must not fire; the rename should just happen.
tags: [codebase-design]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: Rename UserStore.parse_rows to rows_to_dicts everywhere it's used.
  max_turns: 15
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill]
runs: 1
graders:
  - type: tool_used
    name: skill-not-fired
    tool: Skill
    input_match: codebase-design
    min: 0
    max: 0
  - type: regex
    name: renamed-definition
    target: { source: file, path: userstore.py }
    pattern: 'def rows_to_dicts\('
  - type: regex
    name: renamed-call-site
    target: { source: file, path: admin.py }
    pattern: 'store\.rows_to_dicts\('
