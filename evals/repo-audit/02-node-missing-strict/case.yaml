schema_version: "1.0"
name: repo-audit/02-node-missing-strict
description: >-
  TypeScript API with strict: false, no lockfile, no linter, no pre-
  commit, no tests.
tags: [repo-audit]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /skill-tree:repo-audit
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill]
runs: 1
graders:
  - type: regex
    name: checker-produced-report
    target: trace
    pattern: '(FAIL|PASS|MANUAL|N/A)\\n  \d+\. [A-Z]'
  - type: tool_used
    name: read-only-no-edit
    tool: Edit
    min: 0
    max: 0
  - type: tool_used
    name: read-only-no-write
    tool: Write
    min: 0
    max: 0
  - type: regex
    name: summary-line
    target: last_message
    pattern: '\d+\s+pass(ed)?\b[\s\S]{0,60}?\d+\s+fail(ed)?\b'
    flags: i
  - type: regex
    name: mentions-strict
    target: last_message
    pattern: 'strict'
    flags: i
  - type: llm
    name: catches-gaps
    criteria: >-
      The final message audits a Node/TypeScript project that has
      strict: false in tsconfig.json, NO lockfile, NO linter/formatter
      (biome, eslint, prettier), NO pre-commit hooks, NO tests, and NO
      secret scanner. Pass only if it flags at least 4 of those 6 as
      failures, one of them being strict mode disabled, with a concrete
      fix hint for each.
