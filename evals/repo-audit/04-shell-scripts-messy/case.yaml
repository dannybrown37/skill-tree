schema_version: "1.0"
name: repo-audit/04-shell-scripts-messy
description: >-
  Shell scripts with hardcoded credentials and no hygiene. The secrets
  must be called out as serious, not buried.
tags: [repo-audit]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /skill-tree:repo-audit
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill]
runs: 1
graders:
  - type: regex
    name: checker-produced-report
    target: trace
    pattern: '(FAIL|PASS|MANUAL|N/A)\\n  \d+\. [A-Z]'
  - type: tool_used
    name: read-only-no-edit
    tool: Edit
    min: 0
    max: 0
  - type: tool_used
    name: read-only-no-write
    tool: Write
    min: 0
    max: 0
  - type: regex
    name: summary-line
    target: last_message
    pattern: '\d+\s+pass(ed)?\b[\s\S]{0,60}?\d+\s+fail(ed)?\b'
    flags: i
  - type: regex
    name: mentions-secret
    target: last_message
    pattern: 'secret|api.?key|hardcod|credential|password'
    flags: i
  - type: llm
    name: catches-security
    criteria: >-
      The final message audits a project whose scripts/deploy.sh
      hardcodes API_KEY and scripts/backup.sh hardcodes DB_PASSWORD.
      Pass only if (a) it flags those hardcoded credentials as a serious
      or critical problem, naming at least one of the two files or
      variables, and (b) it also flags at least 3 of: no
      shellcheck/shell linting, scripts lacking set -euo pipefail, no
      pre-commit hooks, .env not in .gitignore, no secret scanner such
      as gitleaks.
