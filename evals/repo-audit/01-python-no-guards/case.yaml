schema_version: "1.0"
name: repo-audit/01-python-no-guards
description: >-
  Python app with no guard rails: unpinned deps, no pre-commit, no mypy,
  no ruff, no tests, no secret scanner.
tags: [repo-audit]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /skill-tree:repo-audit
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill]
runs: 1
graders:
  - type: regex
    name: checker-produced-report
    target: trace
    pattern: '(FAIL|PASS|MANUAL|N/A)\\n  \d+\. [A-Z]'
  - type: tool_used
    name: read-only-no-edit
    tool: Edit
    min: 0
    max: 0
  - type: tool_used
    name: read-only-no-write
    tool: Write
    min: 0
    max: 0
  - type: regex
    name: summary-line
    target: last_message
    pattern: '\d+\s+pass(ed)?\b[\s\S]{0,60}?\d+\s+fail(ed)?\b'
    flags: i
  - type: regex
    name: mentions-precommit
    target: last_message
    pattern: 'pre.?commit'
    flags: i
  - type: llm
    name: catches-gaps
    criteria: >-
      The final message audits a Python project that has NO pre-commit
      hooks, NO mypy config, NO tests, NO ruff config, NO lockfile or
      pinned deps, and NO secret scanner. Pass only if it flags at least
      4 of those 6 gaps as failures AND gives a concrete fix hint for
      each one it flags (what to add, not just "missing").
