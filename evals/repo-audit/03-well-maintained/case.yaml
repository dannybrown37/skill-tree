schema_version: "1.0"
name: repo-audit/03-well-maintained
description: >-
  A project that does most things right. The report should pass what is
  configured instead of failing everything, and still flag real gaps.
tags: [repo-audit]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /skill-tree:repo-audit
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill]
runs: 1
graders:
  - type: regex
    name: checker-produced-report
    target: trace
    pattern: '(FAIL|PASS|MANUAL|N/A)\\n  \d+\. [A-Z]'
  - type: tool_used
    name: read-only-no-edit
    tool: Edit
    min: 0
    max: 0
  - type: tool_used
    name: read-only-no-write
    tool: Write
    min: 0
    max: 0
  - type: regex
    name: summary-line
    target: last_message
    pattern: '\d+\s+pass(ed)?\b[\s\S]{0,60}?\d+\s+fail(ed)?\b'
    flags: i
  # Deterministic on purpose: an llm judge with the same intent said FAIL
  # on a report that never claimed a configured item was missing, and PASS
  # on the identical text when replayed outside the harness.
  - type: regex
    name: no-false-absences
    target: last_message
    pattern: "no (\\.pre-commit-config\\.yaml|pre-commit (config|hooks))\\b|no (mypy|type[- ]check(ing|er)) (config|configured)|(mypy|ruff) (is )?not configured|no ruff config|no (tests|test files|tests/ directory)\\b|no gitleaks|(dependencies|deps) (are )?(not pinned|unpinned)|no CLAUDE\\.md|\\.gitignore (does not|doesn't) (cover|exclude|include) (\\.env|\\*\\.pem)"
    flags: i
    match: not_contains
