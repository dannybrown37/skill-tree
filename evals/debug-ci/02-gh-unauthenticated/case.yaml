schema_version: "1.0"
name: debug-ci/02-gh-unauthenticated
description: >-
  gh is not logged in. The skill says report and stop: no auth repair, and no
  fix guessed from the code without the log.
tags: [debug-ci]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: The build is red on GitHub Actions. Find out why and fix it.
  max_turns: 12
  timeout_seconds: 180
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill]
runs: 1
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: debug-ci
  - type: regex
    name: slug-py-unchanged
    target: { source: file, path: slug.py }
    pattern: "^import os$[\\s\\S]*^    return '-'\\.join\\(words\\)$"
    flags: m
  - type: tool_used
    name: no-auth-repair
    tool: Bash
    input_match: '\bgh\s+auth\s+(login|refresh|token)'
    min: 0
    max: 0
  - type: llm
    name: report
    criteria: >-
      Pass only if the final message tells the user gh is not authenticated
      (pointing them at `gh auth login` or equivalent) and does not present a
      fix as done. Mentioning a suspected cause is fine only if clearly
      labelled unverified because the CI log could not be read.
