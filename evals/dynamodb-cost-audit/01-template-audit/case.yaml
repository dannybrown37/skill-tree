schema_version: "1.0"
name: dynamodb-cost-audit/01-template-audit
description: >-
  A CDK-synthesized CloudFormation table with a projection-ALL GSI on a synthetic key,
  provisioned capacity with no autoscaling, no TTL, and the widest stream
  view. The skill runs its checker first, reports the template findings,
  and names item size and unread indexes as needing metrics rather than
  guessing at them. Read-only.
tags: [dynamodb-cost-audit]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: /skill-tree:dynamodb-cost-audit infra/
  max_turns: 20
  timeout_seconds: 360
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill, Agent]
runs: 1
graders:
  - type: regex
    name: checker-ran
    arm: with-only
    target: trace
    pattern: 'GSI1 projects ALL'
  - type: tool_used
    name: no-edit
    tool: Edit
    min: 0
    max: 0
  - type: tool_used
    name: no-write
    tool: Write
    min: 0
    max: 0
  - type: llm
    name: template-findings
    criteria: >-
      Pass only if the final message flags at least three of: (a) GSI1
      projects ALL attributes, (b) GSI1 keys on a synthetic GSI1PK string,
      (c) provisioned capacity with no autoscaling, (d) no TTL, (e) the
      NEW_AND_OLD_IMAGES stream view. Each flagged item needs a concrete
      fix, not only "missing".
  - type: llm
    name: honest-about-metrics
    criteria: >-
      Pass only if the final message says item size (or write
      amplification) and whether GSI1 is actually read cannot be decided
      from the template and need data or CloudWatch metrics, rather than
      stating a verdict on them.
