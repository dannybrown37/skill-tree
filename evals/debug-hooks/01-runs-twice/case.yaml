schema_version: "1.0"
name: debug-hooks/01-runs-twice
description: >-
  The same fmt.sh PostToolUse hook is registered in .claude/settings.json and
  again in the gitignored .claude/settings.local.json, so it runs twice per
  edit. The skill runs its checker, which lists the event as coming from
  several sources, and names both files. Read-only: it never runs the hook.
tags: [debug-hooks]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Every time Claude edits a file in this repo my formatter output shows up
    twice. Why is my hook running twice?
  max_turns: 15
  timeout_seconds: 300
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill, Agent]
runs: 1
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: debug-hooks
  - type: regex
    name: checker-ran
    arm: with-only
    target: trace
    pattern: 'PostToolUse\s+\(\d+ sources\)'
  - type: tool_used
    name: never-runs-the-hook
    tool: Bash
    input_match: 'fmt\.sh'
    min: 0
    max: 0
  - type: tool_used
    name: no-edit
    tool: Edit
    min: 0
    max: 0
  - type: tool_used
    name: no-write
    tool: Write
    min: 0
    max: 0
  - type: llm
    name: names-both-sources
    criteria: >-
      Pass only if the final message says the fmt.sh PostToolUse hook is
      registered in both .claude/settings.json (project settings) and
      .claude/settings.local.json (local settings), and that Claude merges
      them so both entries run on each edit. Suggesting removing one of the two
      entries is a plus but not required.
