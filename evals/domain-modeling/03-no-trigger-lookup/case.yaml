schema_version: "1.0"
name: domain-modeling/03-no-trigger-lookup
description: >-
  Negative trigger: reading the glossary for a definition is not changing
  the model, which the skill says is not its job. Manual-only, so it must
  not fire, and nothing should be written.
tags: [domain-modeling]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: What does our glossary say a Cancellation is?
  max_turns: 8
  timeout_seconds: 120
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill]
runs: 1
graders:
  - type: tool_used
    name: skill-not-fired
    tool: Skill
    input_match: domain-modeling
    min: 0
    max: 0
  - type: tool_used
    name: no-edit
    tool: Edit
    min: 0
    max: 0
  - type: tool_used
    name: no-write
    tool: Write
    min: 0
    max: 0
  - type: llm
    name: answers
    criteria: >-
      Pass only if the final message says a Cancellation withdraws the
      entire Order before it ships.
