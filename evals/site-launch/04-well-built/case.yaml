schema_version: "1.0"
name: site-launch/04-well-built
description: >-
  Control: every automated check passes. A good answer says so, does not
  invent problems, and points at what only the deployed site can confirm
  (analytics, security headers, live checks).
tags: [site-launch]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    Is my site ready to ship? It's in public/, deployed as-is.
  max_turns: 25
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill, Agent]
runs: 1
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: site-launch
  - type: regex
    name: checker-ran
    # The plugin ships this checker, so the no-plugin arm can never pass.
    arm: with-only
    target: trace
    pattern: '(FAIL|PASS|MANUAL|N/A)\\n  \d+\. [A-Z]|\d+ checked, \d+ flagged'
  - type: tool_used
    name: read-only-no-edit
    tool: Edit
    min: 0
    max: 0
  - type: tool_used
    name: read-only-no-write
    tool: Write
    min: 0
    max: 0
  - type: llm
    name: no-invented-failures
    criteria: >-
      FAIL if the message claims any of these are missing or broken: titles,
      meta descriptions, canonical or og: URLs, twitter:card, the RSS feed,
      robots.txt, the sitemap, the favicon, or the 404 page. Otherwise
      PASS. Suggestions phrased as optional polish are fine.
  - type: llm
    name: points-at-deployed-checks
    criteria: >-
      PASS if the message says some items can only be confirmed against the
      deployed site, naming at least one of: analytics, security headers,
      or a live check such as Lighthouse or the og:image returning 200.
      FAIL otherwise.
