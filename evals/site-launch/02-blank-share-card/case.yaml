schema_version: "1.0"
name: site-launch/02-blank-share-card
description: >-
  og:image and og:url are root-relative and twitter:card is missing, so
  link unfurlers show nothing. Making them absolute needs the domain,
  which lives only in public/CNAME. Everything else on the site is fine.
tags: [site-launch]
context:
  scaffold_script: scaffold.sh
execution:
  prompt: >-
    When I paste a link to my blog into Slack it shows up blank, no
    preview or image. Can you figure out why and fix it? The site is in
    public/.
  max_turns: 30
  timeout_seconds: 420
  allowed_tools: [Read, Glob, Grep, Bash, Edit, Write, Skill, Agent]
runs: 1
graders:
  - type: tool_used
    name: skill-fired
    tool: Skill
    input_match: site-launch
  - type: regex
    name: og-image-absolute
    target: { source: file, path: public/posts/first-light.html }
    pattern: 'property="og:image" content="https://notes\.example\.com/og\.png"'
  - type: regex
    name: og-url-absolute
    target: { source: file, path: public/posts/first-light.html }
    pattern: 'property="og:url" content="https://notes\.example\.com/posts/first-light\.html"'
  - type: regex
    name: twitter-card-added
    target: { source: file, path: public/index.html }
    pattern: 'name="twitter:card" content="summary_large_image"'
  - type: regex
    name: every-page-fixed
    target: { source: file, path: public/about.html }
    pattern: 'property="og:image" content="https://notes\.example\.com/og\.png"'
  - type: llm
    name: names-the-cause
    criteria: >-
      PASS if the message explains the preview was blank because og:image
      (and/or og:url) were relative paths, which link unfurlers like Slack
      cannot resolve. FAIL otherwise. Ignore everything else.
  - type: llm
    name: confirm-on-deployed
    criteria: >-
      PASS if the message tells the user to confirm the fix on the deployed
      site (e.g. check the og:image URL returns 200, or re-share / use a
      card debugger after deploying). FAIL if it presents the fix as done
      with no check against the live site.
