[mypy]
# The `mypy` hook passes no targets, so this file is the single answer to
# "what does this repo type-check" -- the same one whether mypy runs from
# pre-commit or by hand. Sources only: the test files lean on monkeypatch
# and pytest idioms mypy reads as errors, and widening it is its own change.
# Directories rather than globs, because `exclude` below only filters what
# mypy discovers by walking -- anything named explicitly is checked anyway,
# and a glob counts as naming it.
files = scripts, skills
exclude = (^|/)(test_.*|conftest)\.py$
# Every script is a standalone top-level module in its own directory, and two
# of them share a basename (scripts/check_skill_structure.py and
# skills/audit-skills/scripts/check_skill_structure.py). Deriving module
# names from the repo root keeps those distinct instead of colliding.
mypy_path = .
namespace_packages = true
explicit_package_bases = true
